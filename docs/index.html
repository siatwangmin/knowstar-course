<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知错星 · 学员课程</title>
  <meta name="description" content="从空目录做出知错星 —— 零基础学员的 AI 编程实践课程">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
  <div class="app">
    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">⭐</span>
          <div class="logo-text">
            <h1>知错星</h1>
            <p>学员课程</p>
          </div>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="收起菜单">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索章节..." autocomplete="off">
      </div>

      <nav class="nav-list" id="navList">
        <!-- 导航项由 JS 生成 -->
      </nav>

      <div class="sidebar-footer">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-text" id="progressText">学习进度 0 / 10</span>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="topbar-title" id="topbarTitle">课程介绍</div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深色/浅色模式">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
        </div>
      </header>

      <div class="content-wrapper">
        <div class="breadcrumb" id="breadcrumb"></div>
        <article class="content" id="content">
          <!-- Markdown 渲染内容 -->
        </article>
        <nav class="page-nav" id="pageNav">
          <!-- 上一页/下一页 -->
        </nav>
      </div>
    </main>
  </div>

  <!-- 回到顶部 -->
  <button class="back-to-top" id="backToTop" aria-label="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
